apiVersion: v1
kind: Service
metadata:
  name: gatekeeper-metrics
  namespace: gatekeeper-system
  labels:
    app: gatekeeper
    component: metrics
spec:
  type: ClusterIP
  selector:
    app: gatekeeper
    control-plane: controller-manager
    gatekeeper.sh/operation: webhook
    gatekeeper.sh/system: "yes"
    release: gatekeeper
  ports:
    - name: metrics
      port: 8888
      targetPort: metrics
      protocol: TCP