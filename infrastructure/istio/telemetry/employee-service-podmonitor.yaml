apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: employee-service-istio
  namespace: monitoring
  labels:
    release: kube-prometheus-stack

spec:
  namespaceSelector:
    matchNames:
      - dev

  selector:
    matchLabels:
      app: employee-service

  podMetricsEndpoints:
    - interval: 15s
      path: /stats/prometheus
      targetPort: 15090


